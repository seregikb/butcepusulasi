<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Сайт незабаром буде доступний.">
  <title>Сайт готується</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7f2;
      color: #17211a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(120deg, rgba(29, 112, 72, 0.08), transparent 45%),
        #f4f7f2;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 8vw, 72px) 0;
      border-top: 4px solid #1d7048;
    }

    p {
      margin: 0 0 16px;
      color: #4d5c52;
      font-size: 1rem;
      line-height: 1.6;
    }

    h1 {
      max-width: 12ch;
      margin: 0 0 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      color: #1d7048;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1d7048;
      content: "";
    }
  </style>
</head>
<body>
  <main>
    <p>Нова сторінка</p>
    <h1>Сайт готується до запуску</h1>
    <p>Ми вже працюємо над наповненням. Незабаром тут з'явиться більше інформації.</p>
    <div class="status">Сторінка працює</div>
  </main>
</body>
</html>
